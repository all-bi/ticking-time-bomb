<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Offline PWA pro dětskou táborovou hru s časovanou bombou.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Bomba</title>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <svg class="logo" viewBox="80 120 360 320" aria-hidden="true">
        <path d="M286 222C304 176 338 154 382 160"></path>
        <circle cx="232" cy="300" r="112"></circle>
        <circle class="spark" cx="398" cy="162" r="20"></circle>
      </svg>
      <h1>Bomba</h1>
    </header>

    <section id="statusCard" class="card status" data-state="ready" aria-live="polite" aria-atomic="true">
      <p id="statusText" class="status-text">Připraveno</p>
      <p id="countdownText" class="countdown" hidden>Zbývá 0,0 s</p>
      <p id="errorText" class="error-text" hidden></p>
    </section>

    <section class="actions" aria-label="Ovládání hry">
      <button id="startButton" class="button button-primary" type="button">START</button>
      <button id="stopButton" class="button button-outline" type="button" disabled>ZASTAVIT</button>
      <button id="manualExplosionButton" class="button button-danger" type="button" disabled>VÝBUCH</button>
    </section>

    <form id="settingsForm" class="card" novalidate>
      <fieldset class="range">
        <legend class="card-title">Délka tikání</legend>
        <div class="range-grid">
        <label class="field">
          <span>Minimum (s)</span>
          <input id="minSeconds" name="minSeconds" type="number" inputmode="decimal" min="0.1" max="3600" step="0.1" value="30" required>
        </label>
        <label class="field">
          <span>Maximum (s)</span>
          <input id="maxSeconds" name="maxSeconds" type="number" inputmode="decimal" min="0.1" max="3600" step="0.1" value="90" required>
        </label>
        </div>
      </fieldset>

      <div class="switches">
        <label class="switch">
          <span>Zobrazit zbývající čas</span>
          <input id="showCountdown" name="showCountdown" type="checkbox" role="switch">
        </label>
        <label class="switch">
          <span>Tlačítko ručního výbuchu</span>
          <input id="allowManualExplosion" name="allowManualExplosion" type="checkbox" role="switch">
        </label>
      </div>

      <div class="tests" role="group" aria-label="Test zvuků">
        <span>Test zvuku</span>
        <button id="testTickButton" class="button button-soft" type="button">Tikání</button>
        <button id="testExplosionButton" class="button button-soft" type="button">Výbuch</button>
      </div>
    </form>

    <section id="installCard" class="install" aria-label="Uložit na plochu" hidden>
      <p id="installText"></p>
      <button id="installButton" class="button button-soft" type="button" hidden>Nainstalovat aplikaci</button>
    </section>
  </main>

  <script src="./app.js" defer></script>
</body>
</html>
